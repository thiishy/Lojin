name: Pipeline CI/CD - Lojin

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar requisitos
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          pip install pytest pip-audit black

      - name: Executar testes (pytest)
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          cd src && python -m pytest

      - name: Auditar vulnerabilidades (pip-audit)
        run: |
          python -m pip_audit -r src/requirements.txt

      - name: Executar linter (black)
        run: |
          python -m black src/ --check --diff

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Logar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildar e enviar imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lojin:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Executar comandos na VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/lojin:latest
            
            docker stop fastapi-container || true
            docker rm fastapi-container || true
            
            docker run -d \
              --name fastapi-container \
              --network="host" \
              --restart always \
              -e DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}" \
              -e DEBUG="False" \
              ${{ secrets.DOCKERHUB_USERNAME }}/lojin:latest